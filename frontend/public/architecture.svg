<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc"><title id="title">CentrAlign AI system architecture</title><desc id="desc">A React frontend uses Keycloak identity and a FastAPI control plane. SQL jobs are processed by isolated agent workers using a configured model and guarded ERP tools. ERPNext remains the system of record. PostgreSQL and private volumes retain execution state and documents.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#6b99ad"/></marker></defs><rect width="1280" height="1040" rx="24" fill="#0c1725"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="48" font-size="16" fill="#77e6cc" letter-spacing="3">CENTRALIGN AI / SYSTEM MAP</text><text x="40" y="93" font-size="34" font-weight="700" fill="#f0f6ff">Execution with identity, state and evidence.</text><rect x="40" y="145" width="360" height="140" rx="16" fill="#132738" stroke="#80bfff" stroke-opacity=".65"/><rect x="41" y="163" width="4" height="104" rx="2" fill="#80bfff"/><text x="64" y="175" font-size="13" letter-spacing="2" fill="#80bfff">EXPERIENCE</text><text x="64" y="209" font-size="25" font-weight="700" fill="#eff6fd">React workspace</text><text x="64" y="242" font-size="19" fill="#b2c8d6">Chat · queues · approvals</text><text x="64" y="268" font-size="19" fill="#b2c8d6">Static frontend on Netlify</text><rect x="460" y="145" width="360" height="140" rx="16" fill="#132738" stroke="#c5a4fb" stroke-opacity=".65"/><rect x="461" y="163" width="4" height="104" rx="2" fill="#c5a4fb"/><text x="484" y="175" font-size="13" letter-spacing="2" fill="#c5a4fb">IDENTITY</text><text x="484" y="209" font-size="25" font-weight="700" fill="#eff6fd">Keycloak</text><text x="484" y="242" font-size="19" fill="#b2c8d6">OIDC · code + PKCE</text><text x="484" y="268" font-size="19" fill="#b2c8d6">Roles and signed access tokens</text><rect x="880" y="145" width="360" height="140" rx="16" fill="#132738" stroke="#f2c37c" stroke-opacity=".65"/><rect x="881" y="163" width="4" height="104" rx="2" fill="#f2c37c"/><text x="904" y="175" font-size="13" letter-spacing="2" fill="#f2c37c">REASONING</text><text x="904" y="209" font-size="25" font-weight="700" fill="#eff6fd">Model provider</text><text x="904" y="242" font-size="19" fill="#b2c8d6">Groq · Gemini · compatible API</text><text x="904" y="268" font-size="19" fill="#b2c8d6">Ollama for local inference</text><rect x="40" y="390" width="360" height="230" rx="16" fill="#132738" stroke="#80bfff" stroke-opacity=".65"/><rect x="41" y="408" width="4" height="194" rx="2" fill="#80bfff"/><text x="64" y="420" font-size="13" letter-spacing="2" fill="#80bfff">CONTROL PLANE</text><text x="64" y="454" font-size="25" font-weight="700" fill="#eff6fd">FastAPI</text><text x="64" y="487" font-size="19" fill="#b2c8d6">JWT validation and role checks</text><text x="64" y="513" font-size="19" fill="#b2c8d6">Job and progress endpoints</text><text x="64" y="539" font-size="19" fill="#b2c8d6">Chat and human decisions</text><text x="64" y="565" font-size="19" fill="#b2c8d6">Canonical ERP HTTP API</text><rect x="460" y="390" width="360" height="230" rx="16" fill="#132738" stroke="#78e7c9" stroke-opacity=".65"/><rect x="461" y="408" width="4" height="194" rx="2" fill="#78e7c9"/><text x="484" y="420" font-size="13" letter-spacing="2" fill="#78e7c9">EXECUTION PLANE</text><text x="484" y="454" font-size="25" font-weight="700" fill="#eff6fd">Isolated agent worker</text><text x="484" y="487" font-size="19" fill="#b2c8d6">One durable queue consumer</text><text x="484" y="513" font-size="19" fill="#b2c8d6">One subprocess for each job</text><text x="484" y="539" font-size="19" fill="#b2c8d6">Strands agents and typed tools</text><text x="484" y="565" font-size="19" fill="#b2c8d6">Deadline · heartbeat · progress</text><rect x="880" y="390" width="360" height="230" rx="16" fill="#132738" stroke="#f2c37c" stroke-opacity=".65"/><rect x="881" y="408" width="4" height="194" rx="2" fill="#f2c37c"/><text x="904" y="420" font-size="13" letter-spacing="2" fill="#f2c37c">ERP BOUNDARY</text><text x="904" y="454" font-size="25" font-weight="700" fill="#eff6fd">Guarded ERP access</text><text x="904" y="487" font-size="19" fill="#b2c8d6">Canonical ERPNext adapter</text><text x="904" y="513" font-size="19" fill="#b2c8d6">Per-user ERP credentials</text><text x="904" y="539" font-size="19" fill="#b2c8d6">Approval, claims and read-back</text><text x="904" y="565" font-size="19" fill="#b2c8d6">ERPNext: system of record</text><rect x="40" y="770" width="360" height="150" rx="16" fill="#132738" stroke="#80bfff" stroke-opacity=".65"/><rect x="41" y="788" width="4" height="114" rx="2" fill="#80bfff"/><text x="64" y="800" font-size="13" letter-spacing="2" fill="#80bfff">PERSISTENCE</text><text x="64" y="834" font-size="25" font-weight="700" fill="#eff6fd">PostgreSQL</text><text x="64" y="867" font-size="19" fill="#b2c8d6">Jobs · events · chat · decisions</text><text x="64" y="893" font-size="19" fill="#b2c8d6">Identity data in a separate DB</text><rect x="460" y="770" width="360" height="150" rx="16" fill="#132738" stroke="#78e7c9" stroke-opacity=".65"/><rect x="461" y="788" width="4" height="114" rx="2" fill="#78e7c9"/><text x="484" y="800" font-size="13" letter-spacing="2" fill="#78e7c9">PRIVATE STORAGE</text><text x="484" y="834" font-size="25" font-weight="700" fill="#eff6fd">Documents and credentials</text><text x="484" y="867" font-size="19" fill="#b2c8d6">Uploaded invoice documents</text><text x="484" y="893" font-size="19" fill="#b2c8d6">ERP key mapping mounted privately</text><rect x="880" y="770" width="360" height="150" rx="16" fill="#132738" stroke="#f2c37c" stroke-opacity=".65"/><rect x="881" y="788" width="4" height="114" rx="2" fill="#f2c37c"/><text x="904" y="800" font-size="13" letter-spacing="2" fill="#f2c37c">ERP SERVICES</text><text x="904" y="834" font-size="25" font-weight="700" fill="#eff6fd">MariaDB and Redis</text><text x="904" y="867" font-size="19" fill="#b2c8d6">ERP documents and accounting</text><text x="904" y="893" font-size="19" fill="#b2c8d6">ERP queues, cache and site files</text><path d="M400 212 H454" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M220 290 V384" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="42" y="340" font-size="16" fill="#aec5d3">HTTPS / bearer token</text><path d="M360 384 V322 H640 V291" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)"/><text x="500" y="315" font-size="16" fill="#aec5d3">JWKS</text><path d="M780 384 V348 H1060 V291" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="905" y="340" font-size="16" fill="#aec5d3">Model calls</text><path d="M826 510 H874" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="827" y="545" font-size="16" fill="#aec5d3">Tools</text><path d="M220 626 V764" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="42" y="701" font-size="16" fill="#aec5d3">Persist jobs and events</text><path d="M500 626 V701 H350 V764" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="365" y="735" font-size="16" fill="#aec5d3">Claim jobs / append progress</text><path d="M640 626 V764" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="655" y="694" font-size="16" fill="#aec5d3">Read / write files</text><path d="M1060 626 V764" fill="none" stroke="#6b99ad" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="1075" y="694" font-size="16" fill="#aec5d3">ERP persistence</text><path d="M40 958 H1240" stroke="#284252"/><text x="40" y="991" font-size="17" fill="#a9c2d1">Primary job path shown. Direct user ERP requests also pass through the canonical API.</text><text x="40" y="1019" font-size="17" fill="#77e6cc">Identity-bound tools  /  Approval gates  /  Durable state  /  Verified outcomes</text></g></svg>
