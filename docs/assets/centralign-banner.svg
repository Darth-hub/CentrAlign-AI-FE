<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="430" viewBox="0 0 1440 430" role="img" aria-labelledby="title desc">
<title id="title">CentrAlign AI — Autonomous procurement operator</title>
<desc id="desc">Turn a company request into an approved, executed and verified procurement outcome.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1525"/><stop offset="1" stop-color="#132a38"/></linearGradient><linearGradient id="accent"><stop stop-color="#65ead0"/><stop offset="1" stop-color="#67b8f3"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#24404c" stroke-opacity=".35"/></pattern></defs>
<rect width="1440" height="430" rx="24" fill="url(#bg)"/>
<rect width="1440" height="430" rx="24" fill="url(#grid)"/>
<rect x="56" y="48" width="280" height="32" rx="16" fill="#173d40" stroke="#2c6f67"/>
<text x="74" y="70" fill="#99f3dd" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2">AUTONOMOUS OPERATIONS</text>
<text x="56" y="166" fill="#f4f8ff" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="700" letter-spacing="-3">CentrAlign AI</text>
<text x="60" y="218" fill="#dce9f1" font-family="Arial,Helvetica,sans-serif" font-size="30">From a company request to a verified ERP outcome.</text>
<text x="60" y="258" fill="#9bb3c2" font-family="Arial,Helvetica,sans-serif" font-size="22">Procurement agents. Persistent execution. Accountable actions.</text>
<g font-family="Arial,Helvetica,sans-serif">
 <rect x="58" y="316" width="280" height="66" rx="12" fill="#152e3b" stroke="#2b4b5a"/><text x="78" y="341" font-size="14" letter-spacing="2" fill="#72e3c8">UNDERSTAND</text><text x="78" y="365" font-size="18" fill="#e6f1f6">Resolve request and context</text>
 <rect x="354" y="316" width="280" height="66" rx="12" fill="#152e3b" stroke="#2b4b5a"/><text x="374" y="341" font-size="14" letter-spacing="2" fill="#8ac8ff">EXECUTE</text><text x="374" y="365" font-size="18" fill="#e6f1f6">Act through scoped ERP tools</text>
 <rect x="650" y="316" width="280" height="66" rx="12" fill="#152e3b" stroke="#2b4b5a"/><text x="670" y="341" font-size="14" letter-spacing="2" fill="#f1cb84">VERIFY</text><text x="670" y="365" font-size="18" fill="#e6f1f6">Return records and evidence</text>
</g>
<g fill="none" stroke="url(#accent)" stroke-width="4"><path d="M1094 114 H1270 V300 H1094 Z" stroke-opacity=".5"/><path d="M1094 208 H1270"/><path d="M1182 114 V300"/></g>
<g fill="#0f2532" stroke="#79e3ce" stroke-width="3"><circle cx="1094" cy="114" r="17"/><circle cx="1270" cy="114" r="17"/><circle cx="1094" cy="300" r="17"/><circle cx="1270" cy="300" r="17"/></g>
<circle cx="1182" cy="208" r="47" fill="#143b43" stroke="#83ecd1" stroke-width="3"/>
<path d="M1197 189 A24 24 0 1 0 1197 227" fill="none" stroke="#b4ffe9" stroke-width="8" stroke-linecap="round"/>
<circle cx="1270" cy="114" r="6" fill="#8cc9ff"/><circle cx="1094" cy="300" r="6" fill="#f3cc84"/>
<text x="1182" y="365" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#91adbb" letter-spacing="2">GOAL / ACTION / EVIDENCE</text>
</svg>
