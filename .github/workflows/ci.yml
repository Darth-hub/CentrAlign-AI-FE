name: Portable runtime CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.lock.txt pytest pytest-asyncio
      - run: pip check
      - run: python -m compileall -q backend scripts
      - run: python -m pytest -c backend/pytest-portable.ini backend/tests_portable
      - run: docker compose --env-file .env.example config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:session
      - run: npm run test:config
      - run: npm run build:netlify
