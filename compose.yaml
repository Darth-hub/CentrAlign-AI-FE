include:
  - path: deploy/compose.erp.yaml
    project_directory: .
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://aria:${POSTGRES_PASSWORD}@postgres:5432/aria
  SERVICE_SECRET: ${SERVICE_SECRET:?Run scripts/init-env.py}
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
  OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8081/realms/aria}
  OIDC_JWKS_URL: http://keycloak:8080/realms/aria/protocol/openid-connect/certs
  OIDC_AUDIENCE: aria-api
  ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:5173}
  ERPNEXT_URL: http://frontend:8080
  ERPNEXT_USER_KEYS_FILE: /run/secrets/erp-users.json
  ADAPTER_API_URL: http://api:8000/api/erp
  STORAGE_PATH: /data/documents
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-900}
  MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-40}
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aria
      POSTGRES_DB: aria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env.py}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run scripts/init-env.py}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/init-postgres.sql:/docker-entrypoint-initdb.d/01-keycloak.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U aria -d aria']
      interval: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    restart: unless-stopped
    command: [start, --http-enabled=true, --proxy-headers=xforwarded]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports: ['127.0.0.1:8081:8080']
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: centralign-ai-runtime:local
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - documents:/data/documents
      - ./secrets:/run/secrets:ro
    ports: ['127.0.0.1:8000:8000']
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      retries: 10
  worker:
    image: centralign-ai-runtime:local
    build: {context: ., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    command: [python, -m, runtime.worker]
    environment: *app-env
    volumes:
      - documents:/data/documents
      - ./secrets:/run/secrets:ro
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on:
      api: {condition: service_healthy}
  bootstrap:
    profiles: [setup]
    image: centralign-ai-runtime:local
    build: {context: ., dockerfile: backend/Dockerfile}
    user: '0:0'
    command: [python, /app/scripts/bootstrap.py]
    env_file: .env
    environment:
      ERPNEXT_URL: http://frontend:8080
      KEYCLOAK_URL: http://keycloak:8080
    volumes:
      - ./secrets:/run/secrets
  proxy:
    profiles: [public]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api, keycloak]
volumes:
  postgres-data:
  documents:
  caddy-data:
